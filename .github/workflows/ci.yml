name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The bridge binds sockets and spawns child processes, and Windows
        # differs from POSIX on both. Both are first-class targets, so both run.
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  plugin-manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A malformed manifest installs as a plugin with zero components and no
      # error, which is hard to notice by hand. Parsing it here is cheap.
      - name: Validate the plugin and marketplace manifests
        run: |
          node -e "
            const fs = require('fs')
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'))
            const marketplace = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'))
            const entry = marketplace.plugins.find(candidate => candidate.name === plugin.name)
            if (!entry) throw new Error('marketplace.json has no entry named ' + plugin.name)
            if (entry.version !== plugin.version) {
              throw new Error('version drift: plugin.json ' + plugin.version + ' vs marketplace.json ' + entry.version)
            }
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            if (pkg.version !== plugin.version) {
              throw new Error('version drift: package.json ' + pkg.version + ' vs plugin.json ' + plugin.version)
            }
            const serverPkg = JSON.parse(fs.readFileSync('server/package.json', 'utf8'))
            if (serverPkg.version !== plugin.version) {
              throw new Error('version drift: server/package.json ' + serverPkg.version + ' vs plugin.json ' + plugin.version)
            }
            for (const dir of plugin.commands || []) {
              if (!fs.existsSync(dir)) throw new Error('commands directory is missing: ' + dir)
            }
            const server = plugin.mcpServers?.bridge
            if (!server) throw new Error('plugin.json declares no bridge MCP server')
            const script = server.args?.[0]?.replace('\${CLAUDE_PLUGIN_ROOT}/', '')
            if (!script || !fs.existsSync(script)) throw new Error('MCP entry point is missing: ' + script)
            console.log('manifests agree on version ' + plugin.version)
          "
